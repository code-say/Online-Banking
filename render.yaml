# Render Blueprint: the whole ASP.NET Core MVC app (pages + data) as one free Docker web service.
services:
  - type: web
    name: online-banking
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Google AI Studio (Gemini) key for the banking assistant. Set it in the Render dashboard; never commit it.
      # Without it the site works normally and the chat panel is simply hidden.
      - key: Assistant__ApiKey
        sync: false
